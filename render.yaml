services:
  # 1. PostgreSQL Database
  - type: pg
    name: inspectra-postgres
    plan: free
    databaseName: inspectra_db
    user: inspectra

  # 2. FastAPI Backend
  - type: web
    name: inspectra-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python seed/seed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inspectra-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_DIR
        value: ./uploads
      - key: PUBLIC_URL
        sync: false # Set to frontend URL once created

  # 3. React Vite Frontend
  - type: web
    name: inspectra-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to backend URL once created
