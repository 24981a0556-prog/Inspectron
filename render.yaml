databases:
  - name: inspectra-postgres
    plan: free
    databaseName: inspectra_db
    user: inspectra

services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: inspectra-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python seed/seed_data.py"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inspectra-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_DIR
        value: ./uploads
      - key: PUBLIC_URL
        sync: false

  # 2. React Vite Frontend Static Site
  - type: web
    name: inspectra-frontend
    env: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
