version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: inspectra_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: inspectra
      POSTGRES_PASSWORD: inspectra
      POSTGRES_DB: inspectra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inspectra -d inspectra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inspectra_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://inspectra:inspectra@postgres:5432/inspectra_db
      SECRET_KEY: inspectra-sih-2026-super-secure-jwt-secret-key-32chars
      ENVIRONMENT: development
      STORAGE_DIR: /app/uploads
      PUBLIC_URL: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inspectra_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
